name: Deploy Pages

on:
  push:
    branches: [mc26]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy site to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
