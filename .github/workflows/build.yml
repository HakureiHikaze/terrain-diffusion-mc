name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew --no-daemon clean build
      - run: ./gradlew --no-daemon build -PuseCpu=true -x test
      - run: ./gradlew --no-daemon build -PuseCuda=true -x test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew.bat --no-daemon clean build -PuseDml=true
