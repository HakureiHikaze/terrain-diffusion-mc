name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.profile.variant }} (MC ${{ matrix.mcTarget }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcTarget: [261, 262]
        profile:
          - { variant: Dml,  flags: '-PuseDml=true' }
          - { variant: Cuda, flags: '-PuseCuda=true' }
          - { variant: Cpu,  flags: '-PuseCpu=true' }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify tag matches mod_version
        run: |
          tag=${GITHUB_REF#refs/tags/}
          mod_ver=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$tag" != "v${mod_ver}" ]; then
            echo "::error::Tag $tag does not match mod_version=${mod_ver} in gradle.properties"
            exit 1
          fi

      - name: Build jar
        run: ./gradlew build ${{ matrix.profile.flags }} -PmcTarget=${{ matrix.mcTarget }}

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.profile.variant }}-mc${{ matrix.mcTarget }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          path: jars

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: jars/**/*.jar
          generate_release_notes: true
