plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.14'
    id 'maven-publish'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

// Minecraft target selection (26.1 / 26.2 / 26.3), chosen via -PmcTarget=26x.
def mcTarget = (project.findProperty('mcTarget') ?: '261').toString()
if (!(mcTarget in ['261', '262', '263'])) {
    throw new GradleException("Unknown -PmcTarget=${mcTarget}; expected one of 261, 262, 263")
}
def minecraftVersion = project.property("mc${mcTarget}_minecraft").toString()
def fabricVersion = project.property("mc${mcTarget}_fabric").toString()
ext.minecraft_version = minecraftVersion
ext.fabric_version = fabricVersion
println "Minecraft target: ${mcTarget} -> minecraft ${minecraftVersion}, fabric-api ${fabricVersion}"

def useCuda = project.hasProperty('useCuda') && project.property('useCuda').toString().toLowerCase() == 'true'
def useDml = project.hasProperty('useDml') && project.property('useDml').toString().toLowerCase() == 'true'
def useCpu = project.hasProperty('useCpu') && project.property('useCpu').toString().toLowerCase() == 'true'
def withSourcesJar = project.hasProperty('withSourcesJar') && project.property('withSourcesJar').toString().toLowerCase() == 'true'

if ([useCuda, useDml, useCpu].count { it } > 1) {
    throw new GradleException("Only one of -PuseCuda, -PuseDml, or -PuseCpu may be specified at a time.")
}
if (!useDml && !useCpu && !useCuda) useDml = true

println "Build variant: ${useCuda ? 'CUDA' : useDml ? 'DirectML (Windows)' : 'CPU'}"
def modelRepositorySlug = 'xandergos/terrain-diffusion-30m-onnx'
def modelRepositoryRevision = 'ad2df557eca5645f588766101cf3bc3682455c3e'
def generatedManifestDirectory = layout.buildDirectory.dir('generated/model-assets').get().asFile
def generatedManifestFile = new File(generatedManifestDirectory, 'model-assets-manifest.json')

// The Maven Java GPU package of ONNX Runtime (even 1.28.0) links CUDA 12 runtime libraries
// (libcublasLt.so.12 etc.); there is no CUDA 13 build on Maven Central. The mod auto-downloads
// and preloads those libraries on Linux servers (see CudaLibraryManager), so a single CUDA
// variant covers both CUDA 12 and CUDA 13 driver environments.
def buildVariant = useCuda ? 'cuda' : useDml ? 'windows' : 'cpu'
version = "${project.mod_version}-${buildVariant}+${minecraftVersion}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The DensityFunction value-range API diverges across 26.1,26.2 and 26.3)
def densityFunctionVariantDir = (mcTarget == '263') ? 'src/mc_263/java' : 'src/mc_legacy/java'
sourceSets.main.java.srcDir densityFunctionVariantDir

loom {
    splitEnvironmentSourceSets()

    mods {
        "terrain-diffusion-mc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        configureEach {
            ideConfigGenerated true
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Local libs first: onnxruntime-dml:1.0 (libs/) and the stripped CUDA jar
    // (build/stripped-ort) exist ONLY here, so resolve them before any remote repo.
    flatDir { dirs 'libs', layout.buildDirectory.dir('stripped-ort').get().asFile }

    // Domestic mirrors for faster downloads (China). Exclude com.microsoft.onnxruntime:
    // the DML jar lives only in libs/ and the CUDA jar only in build/stripped-ort, so a
    // flaky mirror (e.g. 502) must not be able to fail resolution of a local artifact.
    maven {
        url 'https://maven.aliyun.com/repository/public'
        content { excludeGroup 'com.microsoft.onnxruntime' }
    }
    maven {
        url 'https://maven.aliyun.com/repository/central'
        content { excludeGroup 'com.microsoft.onnxruntime' }
    }
    maven {
        url 'https://mirrors.huaweicloud.com/repository/maven/'
        content { excludeGroup 'com.microsoft.onnxruntime' }
    }

    // Essential repositories for Loom (Minecraft, Fabric, etc.)
    //    Note: Loom adds some of these automatically, but it's safe to declare them explicitly.
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

// Repackages onnxruntime_gpu without the win-x64 natives (CUDA variant targets Linux servers;
// Windows users get the DML variant). Served via the flatDir repo above so Loom's include
// accepts it; bundled jar shrinks from 720 MB to ~400 MB. CUDA-only: no-op for other variants.
def stripOrtGpuJar = tasks.register('stripOrtGpuJar', Zip) {
    archiveFileName = 'onnxruntime_gpu-1.28.0-linux.jar'
    destinationDirectory = layout.buildDirectory.dir('stripped-ort')
    from({
        def gpuJar = configurations.runtimeClasspath.find { it.name.startsWith('onnxruntime_gpu') }
        if (gpuJar != null) {
            zipTree(gpuJar)
        }
    })
    exclude 'ai/onnxruntime/native/win-x64/**'
}

if (useCuda) {
    tasks.named('processIncludeJars') { dependsOn stripOrtGpuJar }
}

dependencies {
    // To change the versions see the gradle.properties file.
    // Minecraft 26.1+ is unobfuscated, so no mappings
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"

    if (useCuda) {
        // Java GPU package always links CUDA 12 libs (see CudaLibraryManager), so one version serves all.
        implementation "com.microsoft.onnxruntime:onnxruntime_gpu:1.28.0"
        // Resolved from the flatDir build/stripped-ort repo (win-x64 natives stripped).
        include "com.microsoft.onnxruntime:onnxruntime_gpu:1.28.0-linux"
    } else if (useCpu) {
        implementation "com.microsoft.onnxruntime:onnxruntime:1.28.0"
        include "com.microsoft.onnxruntime:onnxruntime:1.28.0"
    } else if (useDml) {
        implementation 'com.microsoft.onnxruntime:onnxruntime-dml:1.0'
        include 'com.microsoft.onnxruntime:onnxruntime-dml:1.0'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED'
}

processResources {
    dependsOn 'generateModelAssetManifest'
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "minecraft_dependency", project.minecraft_dependency
    inputs.property "loader_version", project.loader_version
    inputs.property "build_variant", buildVariant
    filteringCharset "UTF-8"
    from(generatedManifestFile) {
        into ''
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraftVersion,
                "minecraft_dependency": project.minecraft_dependency,
                "loader_version": project.loader_version
    }
    filesMatching("build-variant.properties") {
        expand "build_variant": buildVariant
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    // Only use toolchain if current Java version is less than target
    // Commented out toolchain to avoid detection issues when Java 21 is already installed
    // if (JavaVersion.current() < javaVersion) {
    //     toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    // }
    // Loom attaches RemapSourcesJar to "build" when this is enabled. Off by default; use -PwithSourcesJar=true.
    if (withSourcesJar) {
        withSourcesJar()
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'log4j2.configurationFile', rootProject.file('log4j2-dev.xml').absolutePath
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

task pipelineTest(type: JavaExec, dependsOn: compileJava) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.xandergos.terraindiffusionmc.pipeline.PipelineTest'
    jvmArgs '-Xmx8g'
}

def committedManifestFile = rootProject.file('model-assets-manifest.json')

tasks.register('generateModelAssetManifest') {
    inputs.property('modelRepositorySlug', modelRepositorySlug)
    inputs.property('modelRepositoryRevision', modelRepositoryRevision)
    if (committedManifestFile.exists()) {
        inputs.file(committedManifestFile)
    }
    outputs.file(generatedManifestFile)

    doLast {
        generatedManifestDirectory.mkdirs()

        // Prefer the committed manifest (builds offline, immune to HF rate limits).
        // Only fall back to a live HF API query when it is missing.
        if (committedManifestFile.exists()) {
            Map committed = new JsonSlurper().parse(committedManifestFile) as Map
            if (committed.revision == modelRepositoryRevision) {
                generatedManifestFile.text = committedManifestFile.text
                return
            }
        }

        String apiUrl = "https://huggingface.co/api/models/${modelRepositorySlug}/revision/${modelRepositoryRevision}?blobs=true"
        HttpURLConnection conn = (HttpURLConnection) new URL(apiUrl).openConnection()
        conn.setRequestMethod('GET')
        conn.setConnectTimeout(15_000)
        conn.setReadTimeout(30_000)
        String hfToken = System.getenv('HF_TOKEN')
        if (hfToken != null && !hfToken.isBlank()) {
            conn.setRequestProperty('Authorization', "Bearer ${hfToken}")
        }
        Map modelInfo = new JsonSlurper().parseText(conn.inputStream.getText('UTF-8')) as Map
        List siblings = modelInfo.siblings as List

        List<String> requiredFiles = [
                'base_model.onnx',
                'coarse_model.onnx',
                'decoder_model.onnx',
                'pipeline_data.json',
                'world_pipeline_config.json'
        ]

        Map<String, Object> assetEntries = [:]
        for (String requiredFileName : requiredFiles) {
            Map siblingEntry = siblings.find { it.rfilename == requiredFileName } as Map
            if (siblingEntry == null) {
                throw new GradleException("Required model asset missing from HF commit ${modelRepositoryRevision}: ${requiredFileName}")
            }

            String resolveUrl = "https://huggingface.co/${modelRepositorySlug}/resolve/${modelRepositoryRevision}/${requiredFileName}?download=true"
            long expectedSizeBytes = ((Number) siblingEntry.size).longValue()
            String expectedSha256
            if (siblingEntry.lfs instanceof Map && siblingEntry.lfs.sha256 != null) {
                expectedSha256 = siblingEntry.lfs.sha256 as String
            } else {
                byte[] remoteFileBytes = new URL(resolveUrl).bytes
                expectedSha256 = sha256Hex(remoteFileBytes)
            }

            assetEntries[requiredFileName] = [
                    sha256: expectedSha256,
                    sizeBytes: expectedSizeBytes,
                    url: resolveUrl
            ]
        }

        Map<String, Object> manifestPayload = [
                repositorySlug: modelRepositorySlug,
                revision: modelRepositoryRevision,
                assets: assetEntries
        ]
        generatedManifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifestPayload))
    }
}

def isWindows = System.getProperty('os.name').toLowerCase().startsWith('windows')
def gradlewExecutable = rootProject.file(isWindows ? 'gradlew.bat' : 'gradlew').absolutePath

['Cuda', 'Dml', 'Cpu'].each { variant ->
    tasks.register("build${variant}", Exec) {
        workingDir rootProject.projectDir
        commandLine gradlewExecutable, 'build', "-Puse${variant}=true"
    }
}

tasks.register('buildAll') {
    dependsOn 'buildCuda', 'buildDml', 'buildCpu'
}

['261', '262', '263'].each { target ->
    tasks.register("buildMc${target}", Exec) {
        workingDir rootProject.projectDir
        commandLine gradlewExecutable, 'build', "-PmcTarget=${target}"
    }
}

tasks.register('buildAllMc') {
    dependsOn 'buildMc261', 'buildMc262', 'buildMc263'
}

String sha256Hex(byte[] fileBytes) {
    MessageDigest messageDigest = MessageDigest.getInstance('SHA-256')
    byte[] digestBytes = messageDigest.digest(fileBytes)
    StringBuilder hexBuilder = new StringBuilder(digestBytes.length * 2)
    for (byte digestByte : digestBytes) {
        hexBuilder.append(String.format('%02x', digestByte))
    }
    return hexBuilder.toString()
}
