<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrain Diffusion Explorer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0c14;
    --surface: #111422;
    --card: #171c30;
    --card-hover: #1c2340;
    --border: #252d4a;
    --border-focus: #3b4a80;
    --accent: #5b8def;
    --accent-glow: rgba(91,141,239,0.18);
    --accent-dim: #1e3270;
    --text: #e2e8f0;
    --text-dim: #8892b0;
    --muted: #5a6684;
    --highlight: #f97316;
    --success: #22c55e;
    --track: #1f2945;
    --shadow: 0 2px 12px rgba(0,0,0,.35);
    --radius: 6px;
    --transition: 0.15s ease;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ── */
  .layout { display: flex; flex: 1; min-height: 0; }

  .sidebar {
    width: 280px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
    gap: 1px;
    user-select: none;
  }

  .sidebar-header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }

  .sidebar-header h1 {
    font-size: 14px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.03em;
  }

  .sidebar-header .logo { font-size: 18px; line-height: 1; }

  /* ── Sections ── */
  .section {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }

  .sec-header {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }

  .sec-title {
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted);
  }

  .sec-arrow {
    font-size: 10px; color: var(--muted);
    transition: transform var(--transition);
  }
  .sec-header.collapsed .sec-arrow { transform: rotate(-90deg); }
  .sec-body { display: flex; flex-direction: column; gap: 8px; }
  .sec-header.collapsed + .sec-body { display: none; }

  /* ── Seed ── */
  .seed-display {
    font-size: 18px; font-weight: 600;
    font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
    color: var(--text);
    word-break: break-all;
  }

  .seed-row { display: flex; gap: 6px; }

  /* ── Channel buttons ── */
  .channel-grid { display: flex; flex-wrap: wrap; gap: 4px; }

  /* ── Filter ── */
  .filter-header {
    display: flex; align-items: center; justify-content: space-between;
  }

  .toggle-label {
    display: flex; align-items: center; gap: 5px;
    cursor: pointer; color: var(--text-dim); font-size: 12px;
  }

  .toggle-label input[type="checkbox"] {
    accent-color: var(--accent); cursor: pointer;
    width: 14px; height: 14px;
  }

  .fch {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    transition: border-color var(--transition);
  }
  .fch:hover { border-color: var(--border-focus); }

  .fch-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }

  .fch-name { font-weight: 600; font-size: 12px; }

  .fch-vals {
    display: flex; justify-content: space-between;
    font-size: 11px; font-family: monospace;
    color: var(--accent); margin-top: 4px;
  }

  /* ── Dual-range slider ── */
  .dual-range { position: relative; height: 20px; }

  .dual-range .track-bg {
    position: absolute; top: 9px; left: 0; right: 0;
    height: 3px; background: var(--track);
    border-radius: 2px; pointer-events: none;
  }

  .dual-range .track-fill {
    position: absolute; top: 9px;
    height: 3px; background: var(--accent);
    border-radius: 2px; pointer-events: none;
  }

  .dual-range input[type="range"] {
    position: absolute; width: 100%; height: 20px; top: 0;
    background: transparent; pointer-events: none;
    -webkit-appearance: none; appearance: none; outline: none;
  }

  .dual-range input[type="range"]::-webkit-slider-thumb {
    pointer-events: all; -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent), 0 2px 6px var(--accent-glow);
    transition: transform var(--transition);
  }
  .dual-range input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

  .dual-range input[type="range"]::-moz-range-thumb {
    pointer-events: all; width: 12px; height: 12px;
    border-radius: 50%; background: var(--accent);
    cursor: pointer; border: 2px solid var(--bg);
  }

  .dual-range input[type="range"]:disabled::-webkit-slider-thumb {
    background: var(--muted); box-shadow: none;
  }

  .fch-hint { font-size: 10px; color: var(--muted); text-align: center; padding: 4px 0 2px; }

  /* ── Map area ── */
  .map-area {
    flex: 1; display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px; padding: 8px;
    min-width: 0; min-height: 0;
  }

  .map-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
    transition: border-color var(--transition);
  }
  .map-panel:focus-within { border-color: var(--border-focus); }

  .panel-header {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0; background: var(--surface);
  }

  .panel-title { font-weight: 600; font-size: 12px; flex-shrink: 0; color: var(--text-dim); }
  .panel-title::before { content: '▸ '; color: var(--accent); }

  .panel-info {
    color: var(--muted); font-size: 11px; font-family: monospace;
    margin-left: auto; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }

  /* ── Nav grid (pan buttons around map) ── */
  .nav-grid {
    display: grid;
    grid-template-columns: 28px 1fr 28px;
    grid-template-rows: 28px 1fr 28px;
    flex: 1; min-height: 0;
    padding: 4px; gap: 2px;
  }

  .pan-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-dim);
    cursor: pointer; font-size: 12px;
    width: 100%; height: 100%;
    transition: all var(--transition);
  }
  .pan-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
  .pan-btn:active { background: var(--accent); color: #fff; transform: scale(0.95); }

  .map-container {
    grid-column: 2; grid-row: 2;
    position: relative; overflow: hidden;
    background: #060813;
    border-radius: 3px; cursor: grab;
  }
  .map-container.grabbing { cursor: grabbing; }

  .map-img {
    width: 100%; height: 100%;
    display: block;
    transition: opacity .2s;
  }

  .map-img.loading { opacity: 0.35; filter: blur(2px); }

  #coarse-img { image-rendering: pixelated; }

  .map-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; pointer-events: none;
    text-align: center; padding: 12px; line-height: 1.6;
  }

  .spinner {
    position: absolute; top: 8px; right: 8px;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.active { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tile-marker {
    position: absolute;
    border: 2px solid var(--highlight);
    box-shadow: 0 0 0 2px rgba(249,115,22,0.25), 0 0 12px rgba(249,115,22,0.15);
    pointer-events: none; display: none;
    border-radius: 2px;
  }

  .btn-up    { grid-column: 2; grid-row: 1; }
  .btn-down  { grid-column: 2; grid-row: 3; }
  .btn-left  { grid-column: 1; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }

  /* ── Controls ── */
  input[type="number"], input[type="text"] {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text);
    padding: 5px 8px; font-size: 12px;
    outline: none; flex: 1; min-width: 0;
    transition: border-color var(--transition);
  }
  input[type="number"]:focus, input[type="text"]:focus { border-color: var(--accent); }

  button {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px; color: var(--text);
    padding: 5px 10px; font-size: 12px;
    cursor: pointer; white-space: nowrap;
    transition: all var(--transition);
    flex-shrink: 0;
  }
  button:hover { background: var(--accent-dim); border-color: var(--accent); }
  button:active { background: var(--accent); transform: scale(0.97); }
  button.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; box-shadow: 0 0 10px var(--accent-glow);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: 0.85; background: var(--accent-dim); }

  button.fch-clear {
    padding: 0 6px; font-size: 14px; line-height: 1;
    color: var(--muted); background: transparent; border: none;
    min-width: 20px; border-radius: 3px;
  }
  button.fch-clear:hover { color: var(--text); background: var(--accent-dim); }

  /* ── Status bar ── */
  .status-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 3px 14px; color: var(--muted);
    font-size: 11px; font-family: monospace;
    flex-shrink: 0; display: flex; align-items: center;
    gap: 12px;
  }

  .status-hint { margin-left: auto; color: var(--text-dim); }

  /* ── Tooltip ── */
  .hover-tooltip {
    position: fixed;
    background: rgba(12,14,28,0.96);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    font-family: monospace; font-size: 13px;
    line-height: 1.8; pointer-events: none;
    display: none; z-index: 200;
    min-width: 170px;
    box-shadow: 0 4px 24px rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
  }

  .hover-tooltip .ht-coord { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .hover-tooltip .ht-row { display: flex; justify-content: space-between; gap: 14px; }
  .hover-tooltip .ht-label { color: var(--muted); }
  .hover-tooltip .ht-val   { color: var(--text); font-weight: 600; }

  /* ── Coordinate Helper ── */
  .coord-scale-row {
    display: flex; align-items: center; gap: 8px;
  }

  .coord-scale-track {
    flex: 1; height: 8px; position: relative;
    border-left: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent);
    border-radius: 0 0 2px 2px;
  }

  .coord-scale-fill {
    position: absolute; left: 0; top: 0;
    height: 100%; background: var(--accent);
    opacity: 0.25; border-radius: 0 0 2px 2px; width: 0;
  }

  .coord-scale-lbl {
    font-size: 11px; color: var(--accent);
    white-space: nowrap; font-weight: 600;
  }

  .coord-block-size { font-size: 11px; color: var(--text-dim); }

  .coord-hint { font-size: 11px; color: var(--muted); font-style: italic; }

  .coord-xyz { display: flex; flex-direction: column; gap: 3px; }

  .coord-xy-row {
    display: flex; justify-content: space-between;
    font-size: 11px;
  }

  .coord-xy-lbl { color: var(--muted); }
  .coord-xy-val { font-family: monospace; color: var(--text); font-weight: 600; }

  .coord-tp {
    display: flex; align-items: center;
    justify-content: center; gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 10px;
    font-family: monospace; font-size: 11px;
    color: var(--text); cursor: pointer;
    user-select: all; transition: all var(--transition);
  }
  .coord-tp:hover { border-color: var(--accent); background: var(--accent-dim); }
  .coord-tp.copied { border-color: var(--success) !important; color: var(--success); }

  /* ── Keyboard hint ── */
  .kbd {
    display: inline-block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 4px;
    font-size: 10px;
    font-family: monospace;
    color: var(--text-dim);
    min-width: 16px;
    text-align: center;
  }

  /* ── Responsive ── */
  @media (max-width: 800px) {
    .sidebar { width: 240px; }
    .map-area { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">🏔</span>
      <h1>Terrain Diffusion</h1>
    </div>

    <!-- Seed -->
    <div class="section">
      <div class="sec-header"><span class="sec-title">Seed</span><span class="sec-arrow">▼</span></div>
      <div class="sec-body">
        <div class="seed-display" id="seed-display">—</div>
        <div class="seed-row">
          <input type="number" id="seed-input" placeholder="Enter seed…">
          <button id="btn-set-seed" class="primary">Set</button>
        </div>
        <button id="btn-new-seed">🎲  Random</button>
      </div>
    </div>

    <!-- Channel -->
    <div class="section">
      <div class="sec-header"><span class="sec-title">Coarse Channel</span><span class="sec-arrow">▼</span></div>
      <div class="sec-body">
        <div class="channel-grid" id="channel-buttons"></div>
      </div>
    </div>

    <!-- Filter -->
    <div class="section">
      <div class="sec-header"><span class="sec-title">Filter</span><span class="sec-arrow">▼</span></div>
      <div class="sec-body">
        <label class="toggle-label">
          <input type="checkbox" id="filter-enable">Enable filter
        </label>
        <button id="btn-stats">Load Stats for Sliders</button>
        <div id="filter-channels"></div>
      </div>
    </div>

    <!-- Coordinate Helper -->
    <div class="section">
      <div class="sec-header"><span class="sec-title">Coordinates</span><span class="sec-arrow">▼</span></div>
      <div class="sec-body">
        <div class="coord-block-size" id="coord-block-size">—</div>
        <div class="coord-scale-row">
          <div class="coord-scale-track">
            <div class="coord-scale-fill" id="coord-scale-fill"></div>
          </div>
          <span class="coord-scale-lbl" id="coord-scale-lbl">—</span>
        </div>
        <div id="coord-rows"><span class="coord-hint">Click detail map → copy /tp</span></div>
      </div>
    </div>
  </aside>

  <!-- ── Maps ── -->
  <div class="map-area">

    <!-- Coarse Map -->
    <div class="map-panel" id="coarse-panel">
      <div class="panel-header">
        <span class="panel-title">Coarse Map</span>
        <button id="coarse-zoom-in" title="Zoom In (C)">+</button>
        <button id="coarse-zoom-out" title="Zoom Out (Z)">−</button>
        <span class="coord-scale-lbl" id="coarse-zoom-label">100×100</span>
        <span class="panel-info" id="coarse-info">click a tile</span>
      </div>
      <div class="nav-grid">
        <button class="pan-btn btn-up"    id="coarse-up"    title="↑">&#9650;</button>
        <button class="pan-btn btn-left"  id="coarse-left"  title="←">&#9664;</button>
        <div class="map-container" id="coarse-container" tabindex="0">
          <img id="coarse-img" class="map-img" alt="coarse map" draggable="false">
          <div class="tile-marker" id="tile-marker"></div>
          <div class="spinner" id="coarse-spinner"></div>
          <div class="map-placeholder" id="coarse-placeholder">Loading…</div>
        </div>
        <button class="pan-btn btn-right" id="coarse-right" title="→">&#9654;</button>
        <button class="pan-btn btn-down"  id="coarse-down"  title="↓">&#9660;</button>
      </div>
    </div>

    <!-- Detail Map -->
    <div class="map-panel" id="detail-panel">
      <div class="panel-header">
        <span class="panel-title">Detail Map</span>
        <button class="active" id="mode-relief">Relief</button>
        <button id="mode-elevation">Elev</button>
        <button id="mode-temperature">Temp</button>
        <span class="panel-info" id="detail-info">click coarse to load</span>
      </div>
      <div class="nav-grid">
        <button class="pan-btn btn-up"    id="detail-up"    title="W / &#8593;">&#9650;</button>
        <button class="pan-btn btn-left"  id="detail-left"  title="A / &#8592;">&#9664;</button>
        <div class="map-container" id="detail-container" tabindex="0">
          <img id="detail-img" class="map-img" alt="detail map" draggable="false" style="display:none">
          <div class="spinner" id="detail-spinner"></div>
          <div class="map-placeholder" id="detail-placeholder">Click coarse map<br>then drag or use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
        </div>
        <button class="pan-btn btn-right" id="detail-right" title="D / &#8594;">&#9654;</button>
        <button class="pan-btn btn-down"  id="detail-down"  title="S / &#8595;">&#9660;</button>
      </div>
    </div>

  </div><!-- .map-area -->
</div><!-- .layout -->

<div class="status-bar" id="status-bar">
  <span>Connecting…</span>
  <span class="status-hint" id="status-hint"></span>
</div>
<div class="hover-tooltip" id="hover-tooltip"></div>

<script>
  const COARSE_PAN_STEP = 20;
  const COARSE_WINDOW_MIN = 8;
  const COARSE_WINDOW_MAX = 120;
  const DETAIL_PAN_STEP = 256;
  const DETAIL_SIZE = 1024;

  const CHANNEL_META = [
    { ch: 0, name: 'Elev',    unit: 'm',  step: 50,  defMin: -8000, defMax: 8000 },
    { ch: 2, name: 'Temp',    unit: '°',  step: 1,   defMin: -30,   defMax: 40   },
    { ch: 3, name: 'T std',   unit: '°',  step: 0.5, defMin: 0,     defMax: 20   },
    { ch: 4, name: 'Precip',  unit: '',   step: 10,  defMin: 0,     defMax: 2000 },
    { ch: 5, name: 'P CV',    unit: '',   step: 1,   defMin: 0,     defMax: 200  },
  ];

  const state = {
    seed: null, channel: 0, channels: [],
    nativeResolution: null, coordScale: 1,
    coarseOffsetI: 0, coarseOffsetJ: 0, coarseWindow: 50,
    coarseData: null,
    detailRaw: null, detailCI: null, detailCJ: null,
    detailPanI: 0, detailPanJ: 0, detailMode: 'relief',
  };

  // ── DOM refs ──
  const seedDisplay     = document.getElementById('seed-display');
  const seedInput       = document.getElementById('seed-input');
  const btnSetSeed      = document.getElementById('btn-set-seed');
  const btnNewSeed      = document.getElementById('btn-new-seed');
  const channelButtons  = document.getElementById('channel-buttons');
  const filterEnable    = document.getElementById('filter-enable');
  const filterChannels  = document.getElementById('filter-channels');
  const btnStats        = document.getElementById('btn-stats');
  const coarseContainer = document.getElementById('coarse-container');
  const coarseImg       = document.getElementById('coarse-img');
  const coarseSpinner   = document.getElementById('coarse-spinner');
  const coarsePlaceholder = document.getElementById('coarse-placeholder');
  const coarseInfo      = document.getElementById('coarse-info');
  const coarseZoomLabel = document.getElementById('coarse-zoom-label');
  const tileMarker      = document.getElementById('tile-marker');
  const detailContainer = document.getElementById('detail-container');
  const detailImg       = document.getElementById('detail-img');
  const detailSpinner   = document.getElementById('detail-spinner');
  const detailPlaceholder = document.getElementById('detail-placeholder');
  const detailInfo      = document.getElementById('detail-info');
  const statusBar       = document.getElementById('status-bar');
  const statusHint      = document.getElementById('status-hint');
  const tooltip         = document.getElementById('hover-tooltip');
  const coordRows       = document.getElementById('coord-rows');
  const coordScaleFill  = document.getElementById('coord-scale-fill');
  const coordScaleLbl   = document.getElementById('coord-scale-lbl');
  const coordBlockSize  = document.getElementById('coord-block-size');

  // ── Collapsible sections ──
  document.querySelectorAll('.sec-header').forEach(hdr => {
    hdr.addEventListener('click', () => hdr.classList.toggle('collapsed'));
  });

  function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

  // ── Filter channel widgets ──
  CHANNEL_META.forEach(({ ch, name, unit, step, defMin, defMax }) => {
    const div = document.createElement('div');
    div.className = 'fch'; div.id = `fch-${ch}`;
    div.innerHTML = `<div class="fch-header"><span class="fch-name">${name}</span><button class="fch-clear" title="Clear">×</button></div><div class="dual-range"><div class="track-bg"></div><div class="track-fill" id="fch-${ch}-fill"></div><input type="range" id="fch-${ch}-min" min="${defMin}" max="${defMax}" step="${step}" value="${defMin}"><input type="range" id="fch-${ch}-max" min="${defMin}" max="${defMax}" step="${step}" value="${defMax}"></div><div class="fch-vals"><span id="fch-${ch}-min-val">—</span><span id="fch-${ch}-max-val">—</span></div><div class="fch-hint" id="fch-${ch}-hint">Click "Load Stats" for ranges</div>`;
    filterChannels.appendChild(div);

    const minEl = document.getElementById(`fch-${ch}-min`);
    const maxEl = document.getElementById(`fch-${ch}-max`);
    const fill  = document.getElementById(`fch-${ch}-fill`);
    const minVal = document.getElementById(`fch-${ch}-min-val`);
    const maxVal = document.getElementById(`fch-${ch}-max-val`);

    function upd() {
      const lo = parseFloat(minEl.value), hi = parseFloat(maxEl.value);
      const rangeMin = parseFloat(minEl.min), rangeMax = parseFloat(minEl.max);
      const span = rangeMax - rangeMin || 1;
      fill.style.left  = ((lo - rangeMin) / span * 100) + '%';
      fill.style.width = ((hi - lo) / span * 100) + '%';
      const prec = step < 1 ? 2 : 0;
      minVal.textContent = lo.toFixed(prec) + unit;
      maxVal.textContent = hi.toFixed(prec) + unit;
    }

    minEl.addEventListener('input', () => { if (parseFloat(minEl.value) > parseFloat(maxEl.value)) maxEl.value = minEl.value; upd(); debouncedLoadCoarse(); });
    maxEl.addEventListener('input', () => { if (parseFloat(maxEl.value) < parseFloat(minEl.value)) minEl.value = maxEl.value; upd(); debouncedLoadCoarse(); });
    div.querySelector('.fch-clear').addEventListener('click', () => { minEl.value = minEl.min; maxEl.value = minEl.max; upd(); debouncedLoadCoarse(); });
    upd();
  });

  // ── Coordinate helper ──
  function niceScaleKm(targetKm) {
    const opts = [0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000];
    return opts.reduce((b,v) => Math.abs(v - targetKm) < Math.abs(b - targetKm) ? v : b);
  }

  function updateCoordScale() {
    const res = state.nativeResolution; if (!res) return;
    const mPerBlock = res / state.coordScale;
    coordBlockSize.textContent = `1 block = ${mPerBlock % 1 === 0 ? mPerBlock : mPerBlock.toFixed(2)} m`;
    const totalKm = DETAIL_SIZE * res / 1000;
    const barKm = niceScaleKm(totalKm * 0.25);
    coordScaleFill.style.width = (barKm / totalKm * 100).toFixed(1) + '%';
    coordScaleLbl.textContent = barKm >= 1 ? `${barKm} km` : `${barKm * 1000} m`;
  }

  function updateCoarseZoomLabel() {
    coarseZoomLabel.textContent = `${state.coarseWindow * 2}×${state.coarseWindow * 2}`;
  }

  function setCoarseWindow(next) {
    const c = clamp(Math.round(next), COARSE_WINDOW_MIN, COARSE_WINDOW_MAX);
    if (c === state.coarseWindow) return;
    state.coarseWindow = c; updateCoarseZoomLabel(); loadCoarse();
  }

  function showDetailCoords(r, c) {
    if (state.detailCI === null || !state.detailRaw) return;
    const { detailCI: ci, detailCJ: cj, detailPanI: pi, detailPanJ: pj, detailRaw } = state;
    const scale = state.coordScale;
    const centerI = ci * 256 + pi, centerJ = cj * 256 + pj;
    const i1x = centerI - detailRaw.h / 2 + r;
    const j1x = centerJ - detailRaw.w / 2 + c;
    const mcX = Math.round(j1x * scale), mcZ = Math.round(i1x * scale);
    const tp = `/tp ${mcX} ~ ${mcZ}`;
    const elev = detailRaw.elev[r * detailRaw.w + c];
    const mcY = Math.round(elev * state.coordScale / state.nativeResolution);
    coordRows.innerHTML = `<div class="coord-xyz"><div class="coord-xy-row"><span class="coord-xy-lbl">X</span><span class="coord-xy-val">${mcX.toLocaleString()}</span></div><div class="coord-xy-row"><span class="coord-xy-lbl">Y</span><span class="coord-xy-val">~${mcY}</span></div><div class="coord-xy-row"><span class="coord-xy-lbl">Z</span><span class="coord-xy-val">${mcZ.toLocaleString()}</span></div><div class="coord-xy-row" style="margin-top:2px"><span class="coord-xy-lbl">Elev</span><span class="coord-xy-val">${elev} m</span></div></div><div class="coord-tp" id="coord-tp-btn" title="Click to copy">${tp}</div>`;
    const btn = document.getElementById('coord-tp-btn');
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(tp).then(() => {
        btn.classList.add('copied'); btn.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = tp; }, 1200);
      });
    });
  }

  // ── Debounce ──
  let dt = null;
  function debouncedLoadCoarse() { clearTimeout(dt); dt = setTimeout(loadCoarse, 300); }

  // ── URL builders ──
  function coarseUrl() {
    const { seed, channel, coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    const ci0 = oi - w, ci1 = oi + w, cj0 = oj - w, cj1 = oj + w;
    let u = `/api/coarse.png?channel=${channel}&ci0=${ci0}&ci1=${ci1}&cj0=${cj0}&cj1=${cj1}&_s=${seed}`;
    if (filterEnable.checked) {
      CHANNEL_META.forEach(({ ch }) => {
        const lo = parseFloat(document.getElementById(`fch-${ch}-min`).value);
        const hi = parseFloat(document.getElementById(`fch-${ch}-max`).value);
        if (lo > parseFloat(document.getElementById(`fch-${ch}-min`).min)) u += `&ch${ch}_min=${lo}`;
        if (hi < parseFloat(document.getElementById(`fch-${ch}-max`).max)) u += `&ch${ch}_max=${hi}`;
      });
    }
    return u;
  }

  function detailUrl() {
    const { seed, detailCI: ci, detailCJ: cj, detailPanI: pi, detailPanJ: pj, detailMode: m } = state;
    return `/api/detail.png?ci=${ci}&cj=${cj}&detail_size=${DETAIL_SIZE}&pan_i=${pi}&pan_j=${pj}&mode=${m}&_s=${seed}`;
  }

  function loadCoarse() {
    state.coarseData = null; coarseImg.classList.add('loading');
    coarseSpinner.classList.add('active');
    coarsePlaceholder.style.display = 'none'; coarseImg.src = coarseUrl();
  }

  async function loadCoarseData() {
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w, seed } = state;
    try {
      const r = await fetch(`/api/coarse_data.json?ci0=${oi-w}&ci1=${oi+w}&cj0=${oj-w}&cj1=${oj+w}&_s=${seed}`);
      state.coarseData = await r.json();
    } catch(_) {}
  }

  function loadDetail() {
    if (state.detailCI === null) return;
    state.detailRaw = null; detailImg.style.display = 'block';
    detailImg.classList.add('loading'); detailSpinner.classList.add('active');
    detailPlaceholder.style.display = 'none'; detailImg.src = detailUrl();
    detailInfo.textContent = `ci=${state.detailCI}, cj=${state.detailCJ} | pan=(${state.detailPanI},${state.detailPanJ})`;
  }

  async function loadDetailRaw() {
    if (state.detailCI === null) return;
    const { detailCI: ci, detailCJ: cj, detailPanI: pi, detailPanJ: pj, seed } = state;
    try {
      const r = await fetch(`/api/detail_raw?ci=${ci}&cj=${cj}&detail_size=${DETAIL_SIZE}&pan_i=${pi}&pan_j=${pj}&_s=${seed}`);
      const h = parseInt(r.headers.get('X-Height'));
      const w = parseInt(r.headers.get('X-Width'));
      const hasTemp = r.headers.get('X-Has-Temp') === '1';
      const buf = await r.arrayBuffer();
      state.detailRaw = { elev: new Int16Array(buf, 0, h * w), temp: hasTemp ? new Float32Array(buf, h * w * 2, h * w) : null, h, w };
    } catch(_) {}
  }

  // ── Image events ──
  coarseImg.onload = () => {
    coarseImg.classList.remove('loading'); coarseSpinner.classList.remove('active');
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    coarseInfo.textContent = `ci=[${oi-w}…${oi+w}], cj=[${oj-w}…${oj+w}]`;
    updateTileMarker(); loadCoarseData();
  };
  coarseImg.onerror = () => { coarseImg.classList.remove('loading'); coarseSpinner.classList.remove('active'); statusBar.firstChild.textContent = 'Coarse map load error'; };
  detailImg.onload = () => { detailImg.classList.remove('loading'); detailSpinner.classList.remove('active'); loadDetailRaw(); };
  detailImg.onerror = () => { detailImg.classList.remove('loading'); detailSpinner.classList.remove('active'); statusBar.firstChild.textContent = 'Detail map load error'; };

  // ── Tile marker ──
  function updateTileMarker() {
    if (state.detailCI === null) { tileMarker.style.display = 'none'; return; }
    const { detailCI: dci, detailCJ: dcj, coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    const ci0 = oi - w, ci1 = oi + w, cj0 = oj - w, cj1 = oj + w;
    if (dci < ci0 || dci >= ci1 || dcj < cj0 || dcj >= cj1) { tileMarker.style.display = 'none'; return; }
    const tI = ci1 - ci0, tJ = cj1 - cj0;
    tileMarker.style.left   = ((dcj - cj0) / tJ * 100) + '%';
    tileMarker.style.top    = ((dci - ci0) / tI * 100) + '%';
    tileMarker.style.width  = (1 / tJ * 100) + '%';
    tileMarker.style.height = (1 / tI * 100) + '%';
    tileMarker.style.display = 'block';
  }

  // ── Tooltip ──
  function showTooltip(e, html) {
    tooltip.innerHTML = html; tooltip.style.display = 'block';
    const x = e.clientX + 18, y = e.clientY - tooltip.offsetHeight / 2;
    tooltip.style.left = Math.min(x, window.innerWidth - tooltip.offsetWidth - 8) + 'px';
    tooltip.style.top  = Math.max(8, Math.min(y, window.innerHeight - tooltip.offsetHeight - 8)) + 'px';
  }

  function hideTooltip() { tooltip.style.display = 'none'; }

  // ── Coarse hover ──
  coarseImg.addEventListener('mousemove', e => {
    if (!state.coarseData) return;
    const { ci0, ci1, cj0, cj1, channels } = state.coarseData;
    const rect = coarseImg.getBoundingClientRect();
    const ci = Math.floor(ci0 + (e.clientY - rect.top) / rect.height * (ci1 - ci0));
    const cj = Math.floor(cj0 + (e.clientX - rect.left) / rect.width * (cj1 - cj0));
    const row = ci - ci0, col = cj - cj0;
    if (row < 0 || row >= ci1 - ci0 || col < 0 || col >= cj1 - cj0) return;
    let html = `<div class="ht-coord">ci=${ci}, cj=${cj}</div>`;
    Object.entries(channels).forEach(([name, data]) => {
      html += `<div class="ht-row"><span class="ht-label">${name}</span><span class="ht-val">${data[row][col].toFixed(1)}</span></div>`;
    });
    showTooltip(e, html);
  });
  coarseImg.addEventListener('mouseleave', hideTooltip);

  // ── Detail hover ──
  detailImg.addEventListener('mousemove', e => {
    if (!state.detailRaw) return;
    const { elev, temp, h, w } = state.detailRaw;
    const rect = detailImg.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / rect.width * w);
    const row = Math.floor((e.clientY - rect.top) / rect.height * h);
    if (row < 0 || row >= h || col < 0 || col >= w) return;
    const idx = row * w + col;
    const eVal = elev[idx];
    const mcY = state.nativeResolution ? Math.round(eVal * state.coordScale / state.nativeResolution) : eVal;
    let html = `<div class="ht-coord">px(${row},${col})</div><div class="ht-row"><span class="ht-label">Elev</span><span class="ht-val">${eVal} m</span></div><div class="ht-row"><span class="ht-label">MC&nbsp;Y</span><span class="ht-val">~${mcY}</span></div>`;
    if (temp) html += `<div class="ht-row"><span class="ht-label">Temp</span><span class="ht-val">${temp[idx].toFixed(2)}°</span></div>`;
    showTooltip(e, html);
  });
  detailImg.addEventListener('mouseleave', hideTooltip);

  // ── Click-drag pan ──
  function addDragPan(container, img, onPan) {
    let dragging = false, sx = 0, sy = 0;
    container.addEventListener('mousedown', e => {
      dragging = true; sx = e.clientX; sy = e.clientY;
      container.classList.add('grabbing');
      e.preventDefault();
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
      onPan(-dx, -dy); sx = e.clientX; sy = e.clientY;
    });
    window.addEventListener('mouseup', () => { if (dragging) { dragging = false; coarseContainer.classList.remove('grabbing'); detailContainer.classList.remove('grabbing'); } });
  }

  let _coarsePanAcc = { dx: 0, dy: 0 };
  addDragPan(coarseContainer, coarseImg, (dx, dy) => {
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    _coarsePanAcc.dx += dx; _coarsePanAcc.dy += dy;
    const rect = coarseImg.getBoundingClientRect();
    const pxPerCI = rect.height / (w * 2);
    const pxPerCJ = rect.width  / (w * 2);
    if (Math.abs(_coarsePanAcc.dx) > pxPerCJ) { state.coarseOffsetJ -= Math.sign(_coarsePanAcc.dx); _coarsePanAcc.dx = 0; }
    if (Math.abs(_coarsePanAcc.dy) > pxPerCI) { state.coarseOffsetI -= Math.sign(_coarsePanAcc.dy); _coarsePanAcc.dy = 0; }
    loadCoarse();
  });

  let _detailPanAcc = { dx: 0, dy: 0 };
  addDragPan(detailContainer, detailImg, (dx, dy) => {
    _detailPanAcc.dx += dx; _detailPanAcc.dy += dy;
    const rect = detailImg.getBoundingClientRect();
    const pxPer = rect.height / DETAIL_SIZE;
    if (Math.abs(_detailPanAcc.dx) > pxPer) { state.detailPanJ -= Math.sign(_detailPanAcc.dx); _detailPanAcc.dx = 0; }
    if (Math.abs(_detailPanAcc.dy) > pxPer) { state.detailPanI -= Math.sign(_detailPanAcc.dy); _detailPanAcc.dy = 0; }
    loadDetail();
  });

  // ── Coarse click → detail ──
  let _coarseClickStart = { x: 0, y: 0 };
  coarseImg.addEventListener('mousedown', e => { _coarseClickStart = { x: e.clientX, y: e.clientY }; });
  coarseImg.addEventListener('click', e => {
    if (Math.abs(e.clientX - _coarseClickStart.x) > 4 || Math.abs(e.clientY - _coarseClickStart.y) > 4) return;
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    const rect = coarseImg.getBoundingClientRect();
    state.detailCI = Math.floor((oi - w) + (e.clientY - rect.top) / rect.height * (w * 2));
    state.detailCJ = Math.floor((oj - w) + (e.clientX - rect.left) / rect.width * (w * 2));
    state.detailPanI = 0; state.detailPanJ = 0;
    updateTileMarker(); loadDetail();
    statusBar.firstChild.textContent = `Tile ci=${state.detailCI}, cj=${state.detailCJ}`;
  });

  // ── Detail click → coords ──
  let _detailClickStart = { x: 0, y: 0 };
  detailImg.addEventListener('mousedown', e => { _detailClickStart = { x: e.clientX, y: e.clientY }; });
  detailImg.addEventListener('click', e => {
    if (!state.detailRaw) return;
    if (Math.abs(e.clientX - _detailClickStart.x) > 4 || Math.abs(e.clientY - _detailClickStart.y) > 4) return;
    const { h, w } = state.detailRaw;
    const rect = detailImg.getBoundingClientRect();
    const col = Math.floor((e.clientX - rect.left) / rect.width * w);
    const row = Math.floor((e.clientY - rect.top) / rect.height * h);
    if (row < 0 || row >= h || col < 0 || col >= w) return;
    showDetailCoords(row, col);
  });

  // ── Channel buttons ──
  function buildChannelButtons(names) {
    channelButtons.innerHTML = '';
    names.forEach((name, i) => {
      const btn = document.createElement('button');
      btn.textContent = name;
      if (i === state.channel) btn.classList.add('active');
      btn.addEventListener('click', () => {
        state.channel = i;
        channelButtons.querySelectorAll('button').forEach((b, j) => b.classList.toggle('active', j === i));
        loadCoarse();
      });
      channelButtons.appendChild(btn);
    });
  }

  // ── Detail mode ──
  ['relief','elevation','temperature'].forEach(mode => {
    document.getElementById(`mode-${mode}`).addEventListener('click', () => {
      state.detailMode = mode;
      ['relief','elevation','temperature'].forEach(m => document.getElementById(`mode-${m}`).classList.toggle('active', m === mode));
      loadDetail();
    });
  });

  // ── Seed ──
  btnSetSeed.addEventListener('click', async () => {
    const v = seedInput.value.trim(); if (!/^-?\d+$/.test(v)) return;
    const r = await fetch('/api/seed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ seed: v }) });
    const d = await r.json();
    state.seed = d.seed; seedDisplay.textContent = d.seed; seedInput.value = '';
    resetDetail(); loadCoarse();
    statusBar.firstChild.textContent = `Seed set to ${d.seed}`;
  });

  btnNewSeed.addEventListener('click', async () => {
    const r = await fetch('/api/new_seed', { method: 'POST' });
    const d = await r.json();
    state.seed = d.seed; seedDisplay.textContent = d.seed;
    resetDetail(); loadCoarse();
    statusBar.firstChild.textContent = `New seed: ${d.seed}`;
  });

  function resetDetail() {
    state.detailCI = state.detailCJ = null; state.detailPanI = state.detailPanJ = 0;
    state.detailRaw = null; detailImg.style.display = 'none';
    detailPlaceholder.style.display = ''; detailInfo.textContent = 'click coarse to load';
    tileMarker.style.display = 'none';
  }

  // ── Filter toggle ──
  filterEnable.addEventListener('change', loadCoarse);

  // ── Stats ──
  btnStats.addEventListener('click', async () => {
    const { coarseOffsetI: oi, coarseOffsetJ: oj, coarseWindow: w } = state;
    const r = await fetch(`/api/coarse_stats?ci0=${oi-w}&ci1=${oi+w}&cj0=${oj-w}&cj1=${oj+w}`);
    const data = await r.json();
    CHANNEL_META.forEach(({ ch, step }) => {
      if (!data[ch]) return;
      const minEl = document.getElementById(`fch-${ch}-min`);
      const maxEl = document.getElementById(`fch-${ch}-max`);
      const hint  = document.getElementById(`fch-${ch}-hint`);
      minEl.min = minEl.value = data[ch].min; minEl.max = data[ch].max; minEl.step = step;
      maxEl.min = data[ch].min; maxEl.max = maxEl.value = data[ch].max; maxEl.step = step;
      if (hint) hint.style.display = 'none';
      minEl.dispatchEvent(new Event('input'));
    });
    const parts = Object.values(data).map(s => `${s.name}: [${s.min}, ${s.max}]`);
    statusBar.firstChild.textContent = 'Stats — ' + parts.join('  |  ');
  });

  // ── Button pan ──
  document.getElementById('coarse-up').addEventListener('click',    () => { state.coarseOffsetI -= COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-down').addEventListener('click',  () => { state.coarseOffsetI += COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-left').addEventListener('click',  () => { state.coarseOffsetJ -= COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-right').addEventListener('click', () => { state.coarseOffsetJ += COARSE_PAN_STEP; loadCoarse(); });
  document.getElementById('coarse-zoom-in').addEventListener('click',  () => setCoarseWindow(state.coarseWindow * 0.8));
  document.getElementById('coarse-zoom-out').addEventListener('click', () => setCoarseWindow(state.coarseWindow * 1.25));

  document.getElementById('detail-up').addEventListener('click',    () => { state.detailPanI -= DETAIL_PAN_STEP; loadDetail(); });
  document.getElementById('detail-down').addEventListener('click',  () => { state.detailPanI += DETAIL_PAN_STEP; loadDetail(); });
  document.getElementById('detail-left').addEventListener('click',  () => { state.detailPanJ -= DETAIL_PAN_STEP; loadDetail(); });
  document.getElementById('detail-right').addEventListener('click', () => { state.detailPanJ += DETAIL_PAN_STEP; loadDetail(); });

  // ── Mouse wheel zoom on coarse ──
  coarseContainer.addEventListener('wheel', e => {
    e.preventDefault();
    setCoarseWindow(state.coarseWindow * (e.deltaY < 0 ? 0.85 : 1.15));
  }, { passive: false });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', e => {
    const t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA') return;

    switch (e.key.toLowerCase()) {
      case 'arrowup':    state.coarseOffsetI -= COARSE_PAN_STEP; loadCoarse(); e.preventDefault(); break;
      case 'arrowdown':  state.coarseOffsetI += COARSE_PAN_STEP; loadCoarse(); e.preventDefault(); break;
      case 'arrowleft':  state.coarseOffsetJ -= COARSE_PAN_STEP; loadCoarse(); e.preventDefault(); break;
      case 'arrowright': state.coarseOffsetJ += COARSE_PAN_STEP; loadCoarse(); e.preventDefault(); break;
      case '-': case '_': setCoarseWindow(state.coarseWindow * 1.25); e.preventDefault(); break;
      case '=': case '+': setCoarseWindow(state.coarseWindow * 0.8); e.preventDefault(); break;
      case 'c': setCoarseWindow(state.coarseWindow * 0.8); break;
      case 'z': setCoarseWindow(state.coarseWindow * 1.25); break;
      case 'w': if (state.detailCI != null) { state.detailPanI -= DETAIL_PAN_STEP; loadDetail(); } break;
      case 's': if (state.detailCI != null) { state.detailPanI += DETAIL_PAN_STEP; loadDetail(); } break;
      case 'a': if (state.detailCI != null) { state.detailPanJ -= DETAIL_PAN_STEP; loadDetail(); } break;
      case 'd': if (state.detailCI != null) { state.detailPanJ += DETAIL_PAN_STEP; loadDetail(); } break;
    }
  });

  // ── Init ──
  async function init() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      state.seed = d.seed; state.channels = d.channels;
      state.nativeResolution = d.native_resolution ?? state.nativeResolution;
      state.coordScale = d.scale || 1;
      seedDisplay.textContent = d.seed;
      buildChannelButtons(d.channels);
      updateCoordScale(); updateCoarseZoomLabel();
      statusBar.firstChild.textContent = `Seed ${d.seed}  |  scale ${d.scale}×`;
      statusHint.textContent = 'Drag to pan  |  ←↑↓→  +/-  C/Z  W/A/S/D';
      loadCoarse();
    } catch (_) {
      statusBar.firstChild.textContent = 'Connection failed — is the Minecraft client running?';
    }
  }
  init();
</script>
</body>
</html>
